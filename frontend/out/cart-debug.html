<!DOCTYPE html>
<html>
<head>
    <title>LocalStorage 测试</title>
    <meta charset="UTF-8">
    <style>
        body { 
            font-family: Arial; 
            padding: 40px; 
            background: #1a1a1a; 
            color: white;
            max-width: 800px;
            margin: 0 auto;
        }
        button { 
            padding: 15px 30px; 
            margin: 10px; 
            cursor: pointer;
            background: #3b82f6;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
        }
        button:hover { background: #2563eb; }
        .result { 
            margin-top: 20px; 
            padding: 20px; 
            background: #2a2a2a; 
            border-radius: 8px;
            min-height: 100px;
        }
        .success { color: #4ade80; }
        .error { color: #f87171; }
        h1 { color: #60a5fa; }
    </style>
</head>
<body>
    <h1>🛒 购物车功能诊断</h1>
    
    <div>
        <button onclick="test1()">1️⃣ 测试 localStorage</button>
        <button onclick="test2()">2️⃣ 测试添加产品</button>
        <button onclick="test3()">3️⃣ 查看购物车</button>
        <button onclick="test4()">4️⃣ 清空购物车</button>
    </div>
    
    <div id="result" class="result">
        <p>点击上面的按钮开始测试...</p>
    </div>
    
    <script>
        const resultDiv = document.getElementById('result');
        
        function test1() {
            try {
                // 测试 localStorage 是否可用
                localStorage.setItem('test', 'hello');
                const value = localStorage.getItem('test');
                localStorage.removeItem('test');
                
                if (value === 'hello') {
                    resultDiv.innerHTML = `
                        <h2 class="success">✅ localStorage 正常工作！</h2>
                        <p>可以继续测试购物车功能</p>
                    `;
                } else {
                    resultDiv.innerHTML = `
                        <h2 class="error">❌ localStorage 读取失败</h2>
                    `;
                }
            } catch (error) {
                resultDiv.innerHTML = `
                    <h2 class="error">❌ localStorage 不可用</h2>
                    <p>错误：${error.message}</p>
                    <p>可能原因：浏览器隐私模式或localStorage被禁用</p>
                `;
            }
        }
        
        function test2() {
            try {
                const product = {
                    id: 529,
                    name: "2026 时尚PU皮革油蜡单肩包",
                    name_zh: "2026 时尚PU皮革油蜡单肩包",
                    price: 12.5,
                    quantity: 1
                };
                
                let cart = JSON.parse(localStorage.getItem('cart') || '[]');
                
                const existingIndex = cart.findIndex(item => item.id === product.id);
                
                if (existingIndex >= 0) {
                    cart[existingIndex].quantity += 1;
                } else {
                    cart.push(product);
                }
                
                localStorage.setItem('cart', JSON.stringify(cart));
                
                resultDiv.innerHTML = `
                    <h2 class="success">✅ 产品添加成功！</h2>
                    <p><strong>产品名称：</strong>${product.name}</p>
                    <p><strong>价格：</strong>$${product.price}</p>
                    <p><strong>购物车商品数：</strong>${cart.length}</p>
                    <p><strong>总数量：</strong>${cart.reduce((sum, item) => sum + item.quantity, 0)}</p>
                `;
            } catch (error) {
                resultDiv.innerHTML = `
                    <h2 class="error">❌ 添加失败</h2>
                    <p>错误：${error.message}</p>
                    <pre>${error.stack}</pre>
                `;
            }
        }
        
        function test3() {
            try {
                const cart = JSON.parse(localStorage.getItem('cart') || '[]');
                
                if (cart.length === 0) {
                    resultDiv.innerHTML = `
                        <h2>🛒 购物车是空的</h2>
                        <p>点击"测试添加产品"按钮添加商品</p>
                    `;
                    return;
                }
                
                let html = '<h2 class="success">🛒 购物车内容：</h2><ul style="list-style: none; padding: 0;">';
                
                cart.forEach((item, index) => {
                    html += `
                        <li style="padding: 10px; margin: 10px 0; background: #333; border-radius: 8px;">
                            <strong>${index + 1}. ${item.name || item.name_zh}</strong><br>
                            <span style="color: #60a5fa;">价格：$${item.price}</span> × 
                            <span style="color: #4ade80;">${item.quantity}</span> = 
                            <span style="color: #fbbf24;">$${(item.price * item.quantity).toFixed(2)}</span>
                        </li>
                    `;
                });
                html += '</ul>';
                
                const total = cart.reduce((sum, item) => sum + (item.price * item.quantity), 0);
                html += `<h3 style="color: #fbbf24;">💰 总计：$${total.toFixed(2)}</h3>`;
                
                resultDiv.innerHTML = html;
            } catch (error) {
                resultDiv.innerHTML = `
                    <h2 class="error">❌ 读取购物车失败</h2>
                    <p>错误：${error.message}</p>
                `;
            }
        }
        
        function test4() {
            try {
                localStorage.removeItem('cart');
                resultDiv.innerHTML = `
                    <h2 class="success">✅ 购物车已清空</h2>
                    <p>localStorage 中的购物车数据已删除</p>
                `;
            } catch (error) {
                resultDiv.innerHTML = `
                    <h2 class="error">❌ 清空失败</h2>
                    <p>错误：${error.message}</p>
                `;
            }
        }
        
        // 页面加载时自动运行测试1
        window.onload = () => {
            test1();
        };
    </script>
</body>
</html>

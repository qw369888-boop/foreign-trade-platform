<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>添加测试商品到购物车</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 40px;
            background: #1a1a1a;
            color: white;
        }
        .container {
            max-width: 600px;
            margin: 0 auto;
            background: #2a2a2a;
            padding: 30px;
            border-radius: 10px;
        }
        h1 { color: #00d4ff; }
        .status { 
            padding: 15px;
            margin: 20px 0;
            border-radius: 5px;
            background: #333;
        }
        .success { border-left: 4px solid #00ff00; }
        .error { border-left: 4px solid #ff0000; }
        button {
            padding: 15px 30px;
            font-size: 16px;
            background: linear-gradient(135deg, #00d4ff, #9333ea);
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            margin: 10px 5px;
        }
        button:hover { opacity: 0.9; }
        pre {
            background: #1a1a1a;
            padding: 15px;
            border-radius: 5px;
            overflow-x: auto;
            font-size: 12px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🛒 购物车测试工具</h1>
        
        <div id="status" class="status">
            <p>准备就绪...</p>
        </div>
        
        <button onclick="addTestProduct()">1. 添加测试商品</button>
        <button onclick="checkCart()">2. 查看购物车数据</button>
        <button onclick="goToCart()">3. 打开购物车页面</button>
        
        <div id="output"></div>
    </div>
    
    <script>
        function addTestProduct() {
            // 添加一个包含完整图片信息的测试商品
            const testProduct = {
                id: 529,
                name: "2026 Fashion PU Leather Oil Wax Shoulder Bag",
                price: 12.5,
                quantity: 1,
                images: ["https://sc04.alicdn.com/kf/H982baaae6ee541638277a721b5acb7fdt.jpg"],
                category: "Handbags",
                moq: "100 Pieces",
                compare_price: 16.25
            };
            
            // 保存到 localStorage
            localStorage.setItem('cart', JSON.stringify([testProduct]));
            
            document.getElementById('status').className = 'status success';
            document.getElementById('status').innerHTML = '<p>✅ 测试商品已添加到购物车！</p>';
            document.getElementById('output').innerHTML = '<pre>' + JSON.stringify(testProduct, null, 2) + '</pre>';
        }
        
        function checkCart() {
            const cart = localStorage.getItem('cart');
            if (cart) {
                const items = JSON.parse(cart);
                const hasImages = items.length > 0 && items[0].images && items[0].images.length > 0;
                
                document.getElementById('status').className = 'status ' + (hasImages ? 'success' : 'error');
                document.getElementById('status').innerHTML = 
                    '<p>购物车商品数量: ' + items.length + '</p>' +
                    '<p>图片字段: ' + (hasImages ? '✅ 存在' : '❌ 不存在') + '</p>';
                document.getElementById('output').innerHTML = '<pre>' + JSON.stringify(items, null, 2) + '</pre>';
            } else {
                document.getElementById('status').className = 'status error';
                document.getElementById('status').innerHTML = '<p>❌ 购物车为空</p>';
                document.getElementById('output').innerHTML = '';
            }
        }
        
        function goToCart() {
            window.location.href = '/zh/cart';
        }
    </script>
</body>
</html>

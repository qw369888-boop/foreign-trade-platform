<!DOCTYPE html>
<html>
<head>
    <title>API Test</title>
    <meta charset="UTF-8">
</head>
<body>
    <h1>API 测试</h1>
    <button onclick="testAPI()">测试 API</button>
    <div id="result"></div>
    
    <script>
        async function testAPI() {
            const resultDiv = document.getElementById('result');
            resultDiv.innerHTML = '加载中...';
            
            try {
                const response = await fetch('http://localhost:4000/api/products?lang=zh&limit=3');
                const data = await response.json();
                
                if (data.success) {
                    resultDiv.innerHTML = `
                        <h2>✅ 成功！</h2>
                        <p>产品数量: ${data.data.length}</p>
                        <h3>产品列表：</h3>
                        <ul>
                            ${data.data.map(p => `<li>${p.name_zh} - $${p.price}</li>`).join('')}
                        </ul>
                    `;
                } else {
                    resultDiv.innerHTML = '<h2>❌ API 返回失败</h2>';
                }
            } catch (error) {
                resultDiv.innerHTML = `<h2>❌ 错误</h2><p>${error.message}</p>`;
            }
        }
        
        // 自动测试
        window.onload = () => testAPI();
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>完整功能测试 - 外贸平台</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }
        
        h1 {
            color: #667eea;
            margin-bottom: 10px;
            font-size: 2.5em;
        }
        
        .subtitle {
            color: #666;
            margin-bottom: 40px;
            font-size: 1.1em;
        }
        
        .test-section {
            margin-bottom: 40px;
            padding: 30px;
            background: #f8f9fa;
            border-radius: 15px;
            border-left: 5px solid #667eea;
        }
        
        .test-section h2 {
            color: #333;
            margin-bottom: 20px;
            font-size: 1.8em;
        }
        
        .test-item {
            display: flex;
            align-items: center;
            padding: 15px;
            margin-bottom: 10px;
            background: white;
            border-radius: 10px;
            transition: all 0.3s;
        }
        
        .test-item:hover {
            transform: translateX(5px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }
        
        .status {
            width: 30px;
            height: 30px;
            border-radius: 50%;
            margin-right: 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            color: white;
        }
        
        .status.pending {
            background: #ffc107;
        }
        
        .status.pass {
            background: #28a745;
        }
        
        .status.fail {
            background: #dc3545;
        }
        
        .test-name {
            flex: 1;
            font-size: 1.1em;
            color: #333;
        }
        
        .test-result {
            font-size: 0.9em;
            color: #666;
            margin-left: 10px;
        }
        
        button {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 15px 40px;
            font-size: 1.1em;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.3s;
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }
        
        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(102, 126, 234, 0.6);
        }
        
        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }
        
        .summary {
            display: flex;
            justify-content: space-around;
            margin-top: 40px;
            padding: 30px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-radius: 15px;
            color: white;
        }
        
        .summary-item {
            text-align: center;
        }
        
        .summary-number {
            font-size: 3em;
            font-weight: bold;
            margin-bottom: 10px;
        }
        
        .summary-label {
            font-size: 1.2em;
            opacity: 0.9;
        }
        
        .log {
            margin-top: 20px;
            padding: 20px;
            background: #1e1e1e;
            color: #00ff00;
            border-radius: 10px;
            font-family: 'Courier New', monospace;
            max-height: 300px;
            overflow-y: auto;
            font-size: 0.9em;
        }
        
        .log-entry {
            margin-bottom: 5px;
        }
        
        .log-entry.error {
            color: #ff6b6b;
        }
        
        .log-entry.success {
            color: #51cf66;
        }
        
        .log-entry.info {
            color: #74c0fc;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🧪 外贸平台完整功能测试</h1>
        <p class="subtitle">自动化测试所有核心功能 - 2026-03-13</p>
        
        <div class="test-section">
            <h2>1️⃣ 后端API测试</h2>
            <div id="backend-tests"></div>
        </div>
        
        <div class="test-section">
            <h2>2️⃣ 前端页面测试</h2>
            <div id="frontend-tests"></div>
        </div>
        
        <div class="test-section">
            <h2>3️⃣ 购物车功能测试</h2>
            <div id="cart-tests"></div>
        </div>
        
        <div class="test-section">
            <h2>4️⃣ 支付流程测试</h2>
            <div id="checkout-tests"></div>
        </div>
        
        <button id="run-tests" onclick="runAllTests()">🚀 开始测试</button>
        
        <div class="summary" id="summary" style="display: none;">
            <div class="summary-item">
                <div class="summary-number" id="total-tests">0</div>
                <div class="summary-label">总测试数</div>
            </div>
            <div class="summary-item">
                <div class="summary-number" id="passed-tests">0</div>
                <div class="summary-label">通过</div>
            </div>
            <div class="summary-item">
                <div class="summary-number" id="failed-tests">0</div>
                <div class="summary-label">失败</div>
            </div>
        </div>
        
        <div class="log" id="log" style="display: none;"></div>
    </div>
    
    <script>
        const tests = {
            backend: [
                { name: '产品列表API', url: 'http://localhost:4000/api/products?lang=zh&limit=3', check: (data) => data.success === true },
                { name: '单个产品API', url: 'http://localhost:4000/api/products/529', check: (data) => data.success === true },
                { name: '分类筛选API', url: 'http://localhost:4000/api/products?category=Handbags', check: (data) => data.success === true },
                { name: 'CORS配置', url: 'http://localhost:4000/api/products', check: async (data, response) => {
                    return response.headers.get('access-control-allow-origin') !== null;
                }}
            ],
            frontend: [
                { name: '首页加载', url: 'http://localhost:3000/zh', check: (html) => html.includes('Dayi') },
                { name: '产品页加载', url: 'http://localhost:3000/zh/products', check: (html) => html.includes('products') },
                { name: '购物车页加载', url: 'http://localhost:3000/zh/cart', check: (html) => html.includes('cart') },
                { name: '关于页加载', url: 'http://localhost:3000/zh/about', check: (html) => html.includes('about') },
                { name: '联系页加载', url: 'http://localhost:3000/zh/contact', check: (html) => html.includes('contact') }
            ],
            cart: [
                { name: 'localStorage可用', test: () => {
                    try {
                        localStorage.setItem('test', '1');
                        localStorage.removeItem('test');
                        return true;
                    } catch(e) {
                        return false;
                    }
                }},
                { name: '购物车数据结构', test: () => {
                    const cart = JSON.parse(localStorage.getItem('cart') || '[]');
                    return Array.isArray(cart);
                }},
                { name: '添加商品到购物车', test: () => {
                    const product = { id: 529, name: '测试产品', price: 12.5, quantity: 1 };
                    let cart = JSON.parse(localStorage.getItem('cart') || '[]');
                    cart.push(product);
                    localStorage.setItem('cart', JSON.stringify(cart));
                    const saved = JSON.parse(localStorage.getItem('cart'));
                    return saved.length > 0 && saved[0].id === 529;
                }}
            ],
            checkout: [
                { name: '结账页面存在', url: 'http://localhost:3000/zh/checkout', check: (html) => html.length > 0 },
                { name: '支付表单可访问', url: 'http://localhost:3000/zh/checkout?product=529', check: (html) => html.length > 0 }
            ]
        };
        
        let totalTests = 0;
        let passedTests = 0;
        let failedTests = 0;
        
        function log(message, type = 'info') {
            const logDiv = document.getElementById('log');
            logDiv.style.display = 'block';
            const entry = document.createElement('div');
            entry.className = `log-entry ${type}`;
            const timestamp = new Date().toLocaleTimeString();
            entry.textContent = `[${timestamp}] ${message}`;
            logDiv.appendChild(entry);
            logDiv.scrollTop = logDiv.scrollHeight;
        }
        
        function updateSummary() {
            document.getElementById('summary').style.display = 'flex';
            document.getElementById('total-tests').textContent = totalTests;
            document.getElementById('passed-tests').textContent = passedTests;
            document.getElementById('failed-tests').textContent = failedTests;
        }
        
        async function runTest(test, container) {
            totalTests++;
            const testItem = document.createElement('div');
            testItem.className = 'test-item';
            testItem.innerHTML = `
                <div class="status pending">⏳</div>
                <div class="test-name">${test.name}</div>
                <div class="test-result">测试中...</div>
            `;
            container.appendChild(testItem);
            
            log(`开始测试: ${test.name}`, 'info');
            
            try {
                let result = false;
                
                if (test.url) {
                    const response = await fetch(test.url);
                    if (test.check) {
                        if (test.url.includes('/api/')) {
                            const data = await response.json();
                            result = await test.check(data, response);
                        } else {
                            const html = await response.text();
                            result = test.check(html);
                        }
                    } else {
                        result = response.ok;
                    }
                } else if (test.test) {
                    result = test.test();
                }
                
                if (result) {
                    testItem.querySelector('.status').className = 'status pass';
                    testItem.querySelector('.status').textContent = '✓';
                    testItem.querySelector('.test-result').textContent = '通过';
                    testItem.querySelector('.test-result').style.color = '#28a745';
                    passedTests++;
                    log(`✓ ${test.name} - 通过`, 'success');
                } else {
                    throw new Error('测试条件不满足');
                }
            } catch (error) {
                testItem.querySelector('.status').className = 'status fail';
                testItem.querySelector('.status').textContent = '✗';
                testItem.querySelector('.test-result').textContent = '失败: ' + error.message;
                testItem.querySelector('.test-result').style.color = '#dc3545';
                failedTests++;
                log(`✗ ${test.name} - 失败: ${error.message}`, 'error');
            }
            
            updateSummary();
        }
        
        async function runAllTests() {
            const button = document.getElementById('run-tests');
            button.disabled = true;
            button.textContent = '测试进行中...';
            
            totalTests = 0;
            passedTests = 0;
            failedTests = 0;
            
            document.getElementById('backend-tests').innerHTML = '';
            document.getElementById('frontend-tests').innerHTML = '';
            document.getElementById('cart-tests').innerHTML = '';
            document.getElementById('checkout-tests').innerHTML = '';
            document.getElementById('log').innerHTML = '';
            
            log('========================================', 'info');
            log('开始完整功能测试', 'info');
            log('========================================', 'info');
            
            // 后端测试
            log('1️⃣ 后端API测试', 'info');
            for (const test of tests.backend) {
                await runTest(test, document.getElementById('backend-tests'));
            }
            
            // 前端测试
            log('2️⃣ 前端页面测试', 'info');
            for (const test of tests.frontend) {
                await runTest(test, document.getElementById('frontend-tests'));
            }
            
            // 购物车测试
            log('3️⃣ 购物车功能测试', 'info');
            for (const test of tests.cart) {
                await runTest(test, document.getElementById('cart-tests'));
            }
            
            // 支付测试
            log('4️⃣ 支付流程测试', 'info');
            for (const test of tests.checkout) {
                await runTest(test, document.getElementById('checkout-tests'));
            }
            
            log('========================================', 'info');
            log(`测试完成! 通过: ${passedTests}/${totalTests}`, passedTests === totalTests ? 'success' : 'error');
            log('========================================', 'info');
            
            button.disabled = false;
            button.textContent = '🔄 重新测试';
        }
    </script>
</body>
</html>

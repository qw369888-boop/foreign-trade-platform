version: '3.8'

services:
  # 外贸独立站主服务
  foreign-trade-platform:
    build: .
    ports:
      - "3000:3000"  # 前端端口
      - "4000:4000"  # 后端API端口
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_API_URL=http://localhost:4000
      - NEXT_PUBLIC_SITE_URL=http://localhost:3000
    volumes:
      - ./database:/app/database  # 数据库持久化
      - ./uploads:/app/uploads    # 文件上传持久化
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Nginx 反向代理（可选）
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf
      - ./ssl:/etc/nginx/ssl  # SSL证书目录
    depends_on:
      - foreign-trade-platform
    restart: unless-stopped

networks:
  default:
    name: foreign-trade-network